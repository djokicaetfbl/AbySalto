<h2>Proizvodi</h2>
<div>
  <div class="row">
    <div class="col-md-4" *ngFor="let product of products">
      <div class="card mb-3">
        <img
          [src]="product.thumbnail"
          class="card-img-top"
          alt="{{ product.title }}"
        />
        <button
          class="btn btn-outline-warning btn-small"
          (click)="addToFavorites(product.id)"
          title="Add to favorites"
        >
          <i class="fa fa-star">Omiljeno</i>
        </button>
        <div class="card-body">
          <h5 class="card-title">{{ product.title }}</h5>
          <p class="card-text">{{ product.description }}</p>
          <p class="card-text">
            <strong>Cijena: </strong>{{ product.price | currency }}
          </p>
          <p class="card-text">
            <strong>Kategorija: </strong>{{ product.category }}
          </p>
          <div class="form-group col-3 mb-3">
            <label for="quantity">Količina</label>
            <input
              type="number"
              id="quantity"
              class="form-control"
              [(ngModel)]="product.quantity"
              [min]="1"
              [max]="99"
              required
            />
          </div>
          <div class="row">
            <div class="col-6">
              <button
                class="btn btn-primary"
                (click)="openProductDetail(product.id)"
              >
                Detaljno
              </button>
            </div>
            <div class="col-6 text-right">
              <button
                class="btn btn-success"
                (click)="addToShoppingCart(product.id, product.quantity)"
              >
                Dodaj u košaricu
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <button
    *ngIf="products.length > 0"
    (click)="loadMore()"
    class="btn btn-primary"
  >
    Učitaj više
  </button>
</div>
